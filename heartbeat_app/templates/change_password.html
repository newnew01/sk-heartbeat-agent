{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน · Branch Heartbeat{% endblock %}
{% block content %}
<section class="login-card">
  <h1>เปลี่ยนรหัสผ่าน</h1>
  <p class="muted">หลังเปลี่ยนสำเร็จ ทุก session จะถูกออกจากระบบและต้องเข้าสู่ระบบใหม่</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>รหัสผ่านปัจจุบัน
      <input name="current_password" type="password" autocomplete="current-password" required>
    </label>
    <label>รหัสผ่านใหม่
      <input name="new_password" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <label>ยืนยันรหัสผ่านใหม่
      <input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <div class="actions">
      <button class="primary" type="submit">เปลี่ยนรหัสผ่าน</button>
      <a class="button secondary" href="{{ url_for('dashboard') }}">ยกเลิก</a>
    </div>
  </form>
</section>
{% endblock %}
